# .github/workflows/skill-ci.yml
#
# Manual Full-Repository Scan (workflow_dispatch only)
# ─────────────────────────────────────────────────────
# This workflow is NOT triggered automatically.
# Use it for:
#   - One-off full-repo health checks
#   - Onboarding a new repo (validate all existing assets at once)
#   - Debugging CI issues against the full asset set
#
# Automated triggers are handled by three dedicated workflows:
#   incoming-precheck.yml  — push to incoming/**  (Layer 1: authoring pre-check)
#   admission-gate.yml     — pull_request          (Layer 2: formal admission)
#   post-merge.yml         — push to master/main   (Layer 3: post-merge validation)
#
# Runs all three layers in sequence:
#   1. State Guard
#   2. Full validate + admission for ALL SKILL.md / TOOL.md in repo
#   3. Capability Catalog publication

name: "Manual · Full Repository Scan"

on:
  workflow_dispatch:
    inputs:
      skip_admission:
        description: "Skip admission gate (authoring validation only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  full-scan:
    name: "Full Repository Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        run: pip install --quiet pyyaml

      # ── Stage 1: State Guard ──────────────────────────────────────────────
      - name: "Stage 1 · State Guard"
        run: |
          mkdir -p reports/full-scan
          python scripts/state_guard.py \
            --skill-registry skill-registry.yaml \
            --tool-registry  tool-registry.yaml  \
            --output         reports/full-scan/state-guard.json

      # ── Stage 2: Validate + Admission (all assets) ───────────────────────
      - name: "Stage 2 · Validate all assets"
        run: |
          python scripts/ci_runner.py \
            --all            \
            --skill-registry skill-registry.yaml \
            --tool-registry  tool-registry.yaml  \
            --output         reports/full-scan/
        continue-on-error: ${{ inputs.skip_admission == 'true' }}

      # ── Stage 3: Capability Catalog ─────────────────────────────────────
      - name: "Stage 3 · Capability catalog"
        run: |
          python scripts/verify_system_definition.py
          python scripts/publish_catalog.py \
            --skill-registry skill-registry.yaml \
            --tool-registry  tool-registry.yaml  \
            --output         catalog/catalog.snapshot.json

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: "Upload full-scan reports"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-scan-${{ github.run_number }}"
          path: |
            reports/full-scan/
            catalog/catalog.snapshot.json
          retention-days: 30
