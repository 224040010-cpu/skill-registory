# .github/workflows/post-merge.yml
#
# Layer 3 — Post-Merge Validation & Registry Update
# ─────────────────────────────────────────────────
# Triggered when a commit is pushed to master / main.
# Purpose: final consistency verification after merge + keep Catalog artifacts fresh.
#
# Scope:
#   1. State Guard (final registry snapshot check)
#   2. Publish catalog/catalog.snapshot.json from updated registries
#   3. Auto-commit updated Catalog snapshot back to master (if changed)
#   4. Lightweight governance refresh (non-blocking report)
#
# Result policy:
#   State Guard FAIL → CI fails (hard stop — a broken registry must not persist)
#   Governance findings → CI passes, findings captured in artifact only
#
# Outputs:
#   - catalog/catalog.snapshot.json committed back to master (if changed)
#   - reports/post-merge/ artifact (retained 30 days)

name: "Layer 3 · Post-Merge Validation"

on:
  push:
    branches: [master, main]
    paths:
      - "**/SKILL.md"
      - "**/TOOL.md"
      - "skill-registry.yaml"
      - "tool-registry.yaml"
      - "contracts/system-definition.json"

jobs:
  post-merge:
    name: "Post-Merge Validation"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated Catalog snapshot

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Use default GITHUB_TOKEN — sufficient for push to same repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        run: pip install --quiet pyyaml

      # ── Stage 1: State Guard (hard fail) ─────────────────────────────────
      - name: "Stage 1 · State Guard (final snapshot)"
        run: |
          mkdir -p reports/post-merge
          python scripts/state_guard.py \
            --skill-registry skill-registry.yaml \
            --tool-registry  tool-registry.yaml  \
            --output         reports/post-merge/state-guard.json

      # ── Stage 2: Publish Capability Catalog ───────────────────────────────
      - name: "Stage 2 · Publish Capability Catalog"
        run: |
          python scripts/verify_system_definition.py
          python scripts/publish_catalog.py \
            --skill-registry skill-registry.yaml \
            --tool-registry  tool-registry.yaml  \
            --output         catalog/catalog.snapshot.json

      # ── Stage 3: Commit Catalog if changed ────────────────────────────────
      - name: "Stage 3 · Commit updated Catalog"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add catalog/catalog.snapshot.json

          # Only commit if the file actually changed
          if git diff --staged --quiet; then
            echo "catalog/catalog.snapshot.json unchanged — no commit needed."
          else
            git commit -m "chore: refresh capability catalog [skip ci]"
            git push
            echo "Catalog committed and pushed."
          fi

      # ── Stage 4: Generate full reports ───────────────────────────────────
      - name: "Stage 4 · Generate governance reports"
        run: |
          python scripts/generate_reports.py \
            --context        merge                             \
            --skill-registry skill-registry.yaml              \
            --tool-registry  tool-registry.yaml               \
            --state-guard    reports/post-merge/state-guard.json \
            --output-dir     reports/post-merge
        continue-on-error: true

      # ── Stage 5: Write Job Summary ────────────────────────────────────────
      - name: "Stage 5 · Write Job Summary"
        if: always()
        run: |
          if [ -f reports/post-merge/job_summary.md ]; then
            cat reports/post-merge/job_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Stage 6: Commit summary.json for badges ───────────────────────────
      - name: "Stage 6 · Commit summary.json (badge data)"
        run: |
          if [ -f reports/post-merge/summary.json ]; then
            cp reports/post-merge/summary.json reports/summary.json
            git add reports/summary.json catalog/catalog.snapshot.json
            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit -m "chore: refresh summary.json + catalog [skip ci]"
              git push
              echo "summary.json and Catalog committed."
            fi
          fi

      # ── Stage 7: Governance refresh (non-blocking) ───────────────────────
      - name: "Stage 7 · Governance refresh (non-blocking)"
        run: |
          python skill-governance-agent/scripts/governance_audit.py \
            --registry      skill-registry.yaml \
            --tool-registry tool-registry.yaml  \
            --skills-root   .                   \
            --output        reports/post-merge
        continue-on-error: true

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: "Upload post-merge reports"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "post-merge-${{ github.run_number }}"
          path: reports/post-merge/
          retention-days: 30
