# tool-registry.yaml
# Central Tool Registry — single source of truth for all platform MCP tools.
#
# Lifecycle: draft → submitted → approved → deprecated → retired
#
# Fields:
#   tool_name     : unique identifier (kebab-case verb-noun)
#   display_name  : human-readable label
#   version       : semver of the published Tool contract
#   category      : parsing | transformation | validation | execution | retrieval | computation
#   risk_level    : L0 (pure computation) | L1 (read) | L2 (analysis) | L3 (write) | L4 (external)
#   side_effects  : none | read | write | external
#   idempotent    : true | false
#   owner_team    : team responsible for implementation
#   service       : MCP server name (must match mcp-tool-catalog.md)
#   status        : draft | submitted | approved | deprecated | retired
#   path          : relative path to TOOL.md from registry root
#   created_at    : ISO date of first registration
#   last_reviewed : ISO date of last governance review
#   called_by_skills: known skill_names that call this tool

