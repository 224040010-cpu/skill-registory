# skill-registry.yaml
# Central Skill Registry — single source of truth for all platform skills.
#
# Status lifecycle:
#   draft → submitted → approved | restricted | needs_revision
#   approved → deprecated → retired
#
# Fields:
#   skill_name      : matches directory name and SKILL.md frontmatter name
#   display_name    : human-readable label
#   purpose         : one-line description of what the skill enables
#   owner_team      : team responsible for maintaining this skill
#   version         : semver string
#   status          : draft | submitted | approved | restricted | deprecated | retired
#   risk_level      : L1 (read-only) | L2 (analysis) | L3 (write/create) | L4 (device control)
#   dependencies    : list of other skill_names this skill depends on (empty = leaf)
#   bundle_scope    : which agent bundle this skill belongs to
#   supported_models: list of Claude model IDs tested and approved
#   eval_status     : pending | passing | failing
#   security_review : not_required | pending | approved | rejected
#   path            : relative path to SKILL.md from registry root
#   created_at      : ISO date of first registration
#   last_reviewed   : ISO date of last governance review

